<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Zukhanye Mayekiso - Data Science and Business Intelligence">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14091F"/>
      <stop offset="0.55" stop-color="#22103F"/>
      <stop offset="1" stop-color="#34124F"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#A855F7" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F0ABFC"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A855F7"/>
      <stop offset="1" stop-color="#F472B6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#D946EF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D946EF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- Chart motif (right) -->
  <g transform="translate(760,40)">
    <g fill="url(#bar)">
      <rect x="0"   y="190" width="34" height="90"  rx="4"/>
      <rect x="52"  y="150" width="34" height="130" rx="4"/>
      <rect x="104" y="170" width="34" height="110" rx="4"/>
      <rect x="156" y="110" width="34" height="170" rx="4"/>
      <rect x="208" y="130" width="34" height="150" rx="4"/>
      <rect x="260" y="70"  width="34" height="210" rx="4"/>
      <rect x="312" y="90"  width="34" height="190" rx="4"/>
      <rect x="364" y="30"  width="34" height="250" rx="4"/>
      <rect x="416" y="50"  width="34" height="230" rx="4"/>
    </g>
    <line x1="-10" y1="280" x2="470" y2="280" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1.5"/>
    <polyline points="17,170 69,128 121,148 173,84 225,102 277,44 329,64 381,6 433,24"
              fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#14091F" stroke="#F9A8D4" stroke-width="3">
      <circle cx="17" cy="170" r="6"/>
      <circle cx="69" cy="128" r="6"/>
      <circle cx="121" cy="148" r="6"/>
      <circle cx="173" cy="84" r="6"/>
      <circle cx="225" cy="102" r="6"/>
      <circle cx="277" cy="44" r="6"/>
      <circle cx="329" cy="64" r="6"/>
      <circle cx="381" cy="6" r="6"/>
      <circle cx="433" cy="24" r="6"/>
    </g>
  </g>

  <!-- Text (left) -->
  <g font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="96" font-size="15" font-weight="600" letter-spacing="4" fill="#F9A8D4">DATA SCIENCE  ·  BUSINESS INTELLIGENCE</text>
    <text x="80" y="172" font-size="64" font-weight="800" fill="#F8FAFC">Zukhanye</text>
    <text x="80" y="238" font-size="64" font-weight="800" fill="#F8FAFC">Mayekiso</text>
    <rect x="80" y="258" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="80" y="298" font-size="22" font-weight="500" fill="#EBDDFB">Turning data into insights  ·  SQL  ·  Python  ·  R  ·  Power BI</text>
    <text x="80" y="328" font-size="15" font-weight="400" fill="#C9B4F0">Final-year Data Science student  ·  Belgium Campus ITversity  ·  Johannesburg, South Africa</text>
  </g>
</svg>
